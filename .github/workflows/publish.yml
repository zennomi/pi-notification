name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (defaults to selected ref)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish pi-notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Skip already published version
        id: published
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          encoded_name="${name//\//%2F}"
          package_url="https://registry.npmjs.org/${encoded_name}"
          version_url="${package_url}/${version}"

          package_status=$(curl -sS -o /dev/null -w '%{http_code}' "$package_url")
          case "$package_status" in
            404)
              echo "Package ${name} is not registered on npm yet."
              echo "Configure npm Trusted Publishing for ${name} with repository zennomi/pi-notification and workflow publish.yml."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              version_status=$(curl -sS -o /dev/null -w '%{http_code}' "$version_url")
              case "$version_status" in
                200)
                  echo "${name}@${version} is already published on npm; publish intentionally skipped."
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  ;;
                404)
                  echo "${name}@${version} is not published yet; continuing."
                  echo "skip=false" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "Unexpected npm registry response for ${name}@${version}: HTTP ${version_status}" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unexpected npm registry response for package ${name}: HTTP ${package_status}" >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run ci

      - name: Setup npm Trusted Publishing
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        if: steps.published.outputs.skip != 'true'
        run: npm install -g npm@latest

      - name: Publish pi-notification to npm
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          publish_output=$(npm publish --access public 2>&1)
          publish_status=$?
          echo "$publish_output"
          if [ "$publish_status" -ne 0 ]; then
            if echo "$publish_output" | grep -q 'npm error code E404'; then
              echo "::error::npm publish failed with E404 Not Found. Configure Trusted Publishing for ${GITHUB_REPOSITORY} / publish.yml."
            fi
            exit "$publish_status"
          fi
